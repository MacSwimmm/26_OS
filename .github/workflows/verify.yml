name: Verify scheduler and dashboard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record actual environment
        run: |
          cat /etc/os-release
          python --version
          git rev-parse HEAD
      - run: python -m unittest discover -s tests -v
      - run: ./scripts/run_experiments.sh
      - run: python run_demo.py --input data/demos/basic.json --csv results/basic.csv
      - run: python -m scripts.verify_workloads
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}-python${{ matrix.python }}
          path: results/
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser
          path: results/browser/
